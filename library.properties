sentence=Fast decoder for a custom 6-bar pharmacode-style barcode, built for camera-based target tracking.
paragraph=Reads a fixed 6-bar (2 sync + 4 data, 16-code) linear barcode directly from a grayscale camera frame buffer. Uses per-column, multi-threshold structural matching rather than a single global or fixed-window pixel threshold, so it stays robust across mixed/harsh lighting (e.g. a sunlit target near a dark shadow) and works at both close and long range without the resolution loss a downscale-based approach would cost. No dynamic allocation in the decode path -- designed for ESP32-CAM style projects where you already have a grayscale frame buffer in hand.
